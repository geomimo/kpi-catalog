  - {from: DEF-0306, to: DEF-0304, type: composed_of, role: denominator}
  - {from: DEF-0307, to: DEF-0301, type: composed_of, role: numerator}
  - {from: DEF-0307, to: DEF-0304, type: composed_of, role: denominator}   # Finance divides by PRODUCT's active users


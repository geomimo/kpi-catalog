# kpigen scenarios: the fixed organisation and the demo fixtures (PRD §3.4, §7, §8).
# Every ID here is fixed and must never be renumbered. kpigen copies these exactly and fills the
# rest of the organisation around them with a seeded random generator.
#
# Free text marked TODO(george) must be written by a person (CLAUDE.md: no LLM-written KPI names,
# definitions or tags). `uv run kpigen` warns about them; `uv run kpigen --strict` fails on them.

company:
  name: Acme                      # P2: company name still open; change it only here
  email_domain: acme.example
  bi_url: https://bi.acme.example

generation:
  random_seed: 42
  reference_date: "2026-10-01"      # "today" for the seed: nothing is dated after it
  earliest_date: "2024-01-08"       # first definition dates from here
  users_total: 53                 # USR-001 .. USR-053, fixtures included
  assets_total: 35
  community_tag_uses_per_label: 3 # random community taggings on top of the fixtures

divisions:
  - {division_id: DIV-001, code: FIN, name: Finance, description: "Group finance: accounting, controlling, treasury, tax and the banking arm's finance."}
  - {division_id: DIV-002, code: COM, name: Commercial, description: "Buying, pricing and sales across stores, online, food-to-go and mobile."}
  - {division_id: DIV-003, code: MKT, name: Marketing, description: "Brand, campaigns, media spend and loyalty communication."}
  - {division_id: DIV-004, code: PRD, name: Product, description: "The online shop, the app and the paid membership."}
  - {division_id: DIV-005, code: OPS, name: Operations, description: "Stores operations, supply chain, logistics and own-brand production."}
  - {division_id: DIV-006, code: PPL, name: People, description: "HR: workforce, engagement and wellbeing."}
  - {division_id: DIV-007, code: RSK, name: Risk & Compliance, description: "Risk, compliance and the insurance arm."}
  - {division_id: DIV-008, code: DAT, name: Data & Analytics, description: "The data platform, the semantic layer and data governance."}

roles:
  - {role_id: ROL-01, code: observer, name: Observer, description: "Reads published definitions and adds community tags."}
  - {role_id: ROL-02, code: contributor, name: Contributor, description: "Proposes definitions in their division and submits them for review."}
  - {role_id: ROL-03, code: curator, name: Curator, description: "Proposes, edits and deprecates definitions and manages tags in their division."}
  - {role_id: ROL-04, code: reviewer, name: Reviewer, description: "Approves, rejects or requests changes to submitted definitions in their division."}
  - {role_id: ROL-05, code: admin, name: Admin, description: "Group-wide governance: every permission in every division."}

# PRD §4.1 permission table
permissions:
  - {permission_id: PRM-01, code: tag.add_community, description: "Add community tags to definitions", roles: [observer, contributor, curator, reviewer, admin]}
  - {permission_id: PRM-02, code: definition.view_unpublished, description: "See drafts, in-review and rejected definitions of the division", roles: [contributor, curator, reviewer]}
  - {permission_id: PRM-03, code: definition.view_unpublished_all, description: "See unpublished definitions of every division", roles: [admin]}
  - {permission_id: PRM-04, code: definition.propose, description: "Create drafts and submit them for review", roles: [contributor, curator, admin]}
  - {permission_id: PRM-05, code: definition.edit, description: "Edit approved definitions", roles: [curator, admin]}
  - {permission_id: PRM-06, code: definition.deprecate, description: "Deprecate approved definitions", roles: [curator, admin]}
  - {permission_id: PRM-07, code: definition.approve, description: "Approve, reject or request changes", roles: [reviewer, admin]}
  - {permission_id: PRM-08, code: tag.manage, description: "Validate ML tags and promote community tags", roles: [curator, admin]}
  - {permission_id: PRM-09, code: governance.manage, description: "Governance flags page and TTL export", roles: [admin]}


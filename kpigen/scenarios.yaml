# Hand-written conflict cases (PRD §3.2, UC2) and Katerina's draft (UC3).
# Texts drafted with GenAI (see the provenance note at the top).
handwritten_definitions:
  - {definition_id: DEF-0301, ref: turnover_fin, kpi_id: KPI-0058, division: FIN, display_name: Turnover, metric_type: base, unit: EUR, grain: monthly,
     definition_text: "Revenue booked in the general ledger for the month across all business lines, net of VAT and after returns, credit notes and discounts, in EUR.",
     formula: "sum(gl_revenue_eur) where account_class = 'revenue'"}
  - {definition_id: DEF-0302, ref: turnover_com, kpi_id: KPI-0058, division: COM, display_name: Turnover, metric_type: base, unit: USD, grain: monthly, owner: USR-007,
     definition_text: "Sum of the product revenue of every order line, excluding tax and before refunds are processed, in USD as held in the commercial data model.",
     formula: "sum(order_item_revenue_excl_tax)"}
  - {definition_id: DEF-0303, ref: turnover_prd, kpi_id: KPI-0058, division: PRD, display_name: Turnover, metric_type: base, unit: EUR, grain: monthly,
     definition_text: "Gross value of completed purchases in the online shop and the app, including tax and before refunds.",
     formula: "sum(completed_order_gross_amount)"}
  - {definition_id: DEF-0304, ref: active_users_prd, kpi_id: KPI-0059, division: PRD, display_name: Active Users, metric_type: base, unit: count, grain: monthly,
     definition_text: "Number of distinct customers who completed at least one purchase in the last 30 days.",
     formula: "count(distinct customer_id) where last_purchase_at >= period_end - 30 days"}
  - {definition_id: DEF-0305, ref: active_users_mkt, kpi_id: KPI-0059, division: MKT, display_name: Active Users, metric_type: base, unit: count, grain: monthly,
     definition_text: "Number of distinct visitors with at least one session on the website or in the app in the last 30 days, whether or not they bought anything.",
     formula: "count(distinct visitor_id) where last_session_at >= period_end - 30 days"}
  - {definition_id: DEF-0306, ref: atopu_prd, kpi_id: KPI-0060, division: PRD, display_name: ATOPU, metric_type: ratio, unit: EUR, grain: monthly,
     definition_text: "Product's turnover for the month divided by Product's active users: the average gross purchase value per transacting customer.",
     formula: "turnover_prd / active_users_prd"}
  - {definition_id: DEF-0307, ref: atopu_fin, kpi_id: KPI-0060, division: FIN, display_name: ATOPU, metric_type: ratio, unit: EUR, grain: monthly,
     definition_text: "Finance's booked turnover for the month divided by Product's active users, as reported in the Finance board pack.",
     formula: "turnover_fin / active_users_prd"}
  - {definition_id: DEF-0310, ref: katerina_draft, kpi_id: KPI-0018, division: COM, display_name: Stock Turn Ratio,
     metric_type: base, unit: times, grain: monthly, owner: USR-007,
     definition_text: "How many times the average stock in Commercial's stores is sold and replenished in a month: cost of goods sold divided by average inventory value at cost.",
     formula: "cogs / avg_inventory_value"}

# Lineage between hand-written definitions (UC2: ATOPU).
handwritten_relationships:
  - {from: DEF-0306, to: DEF-0303, type: composed_of, role: numerator}
  - {from: DEF-0306, to: DEF-0304, type: composed_of, role: denominator}
  - {from: DEF-0307, to: DEF-0301, type: composed_of, role: numerator}
  - {from: DEF-0307, to: DEF-0304, type: composed_of, role: denominator}   # Finance divides by PRODUCT's active users

# Fixed status, owner and history for scenario definitions. Everything else is random.
#   changes_requested_before: a "changes requested" review precedes the current status
definition_fixtures:
